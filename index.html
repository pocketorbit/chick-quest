<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHICK QUEST</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #ffd6a5;
    --sky-mid: #ffadad;
    --sky-bot: #fdffb6;
    --grass: #95d5b2;
    --grass-dark: #52b788;
    --wood: #8b5a2b;
    --wood-dark: #5d3a1a;
    --shell: #fff8dc;
    --gold: #ffc300;
    --accent: #ff6b35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'VT323', monospace;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a1810;
  }

  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    max-height: 800px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bot) 100%);
    box-shadow: 0 0 0 4px var(--wood), 0 0 30px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .hud-block {
    background: var(--wood);
    border: 3px solid var(--wood-dark);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--shell);
    box-shadow: 0 3px 0 var(--wood-dark);
  }

  .hud-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--gold);
    margin-bottom: 2px;
  }

  .hud-value {
    font-family: 'VT323', monospace;
    font-size: 24px;
    line-height: 1;
    color: var(--shell);
  }

  .evo-gauge-wrap {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    background: var(--wood);
    border: 3px solid var(--wood-dark);
    border-radius: 6px;
    padding: 5px 8px 6px;
    box-shadow: 0 3px 0 var(--wood-dark);
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 200px;
  }
  .evo-gauge-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .evo-gauge-bar {
    flex: 1;
    height: 10px;
    background: var(--wood-dark);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .evo-gauge-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffc300, #ff8c42, #ff6b35);
    transition: width 0.3s ease-out;
    box-shadow: 0 0 6px rgba(255, 195, 0, 0.6);
  }
  .evo-gauge-pips {
    position: absolute;
    inset: 0;
    display: flex;
    pointer-events: none;
  }
  .evo-gauge-pips .pip {
    flex: 1;
    border-right: 1px solid rgba(0,0,0,0.4);
  }
  .evo-gauge-pips .pip:last-child { border-right: none; }
  .evo-gauge-wrap.maxed .evo-gauge-label { color: #fff; }
  .evo-gauge-wrap.hidden { display: none; }

  .sound-toggle {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    background: var(--wood);
    border: 3px solid var(--wood-dark);
    border-radius: 50%;
    color: var(--shell);
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 3px 0 var(--wood-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sound-toggle.muted { opacity: 0.5; }

  .power-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 10;
    pointer-events: none;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 90%;
  }

  .power-pill {
    background: var(--wood);
    border: 2px solid var(--wood-dark);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--shell);
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 0 var(--wood-dark);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  .egg-cooldown {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    background: var(--wood);
    border: 2px solid var(--wood-dark);
    border-radius: 4px;
    padding: 4px 12px;
    color: var(--shell);
    font-family: 'VT323', monospace;
    font-size: 16px;
    display: none;
    box-shadow: 0 2px 0 var(--wood-dark);
  }
  .egg-cooldown.show { display: flex; align-items: center; gap: 6px; }
  .egg-cooldown .bar {
    width: 60px; height: 8px;
    background: var(--wood-dark);
    border-radius: 2px; overflow: hidden;
  }
  .egg-cooldown .fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.05s linear;
  }

  .version-badge {
    position: absolute;
    right: 10px;
    bottom: 8px;
    z-index: 21;
    pointer-events: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: rgba(255, 248, 220, 0.78);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(43, 24, 16, 0.92);
    z-index: 20;
    text-align: center;
    padding: 20px;
    transition: opacity 0.3s;
    overflow-y: auto;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(24px, 7vw, 38px);
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent), 6px 6px 0 var(--wood-dark);
    letter-spacing: 2px;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .subtitle {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--shell);
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  .evo-show {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 20px;
    flex-wrap: nowrap;
    width: 100%;
    max-width: 360px;
    min-height: 80px;
  }
  .evo-show img {
    max-width: 56px;
    max-height: 72px;
    width: auto;
    height: auto;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    object-fit: contain;
    display: block;
  }
  .evo-show .evo-arrow {
    flex-shrink: 0;
    font-size: 14px;
  }
  .evo-arrow {
    color: var(--gold);
    font-size: 18px;
    font-family: 'Press Start 2P', monospace;
  }

  .controls-hint {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--shell);
    margin-bottom: 20px;
    line-height: 1.6;
    max-width: 320px;
  }
  .controls-hint span { color: var(--gold); font-weight: bold; }

  .item-legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 24px;
    font-family: 'VT323', monospace;
    font-size: 14px;
    text-align: left;
    max-width: 320px;
    color: var(--shell);
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 6px;
    background: rgba(255, 248, 220, 0.1);
    border-radius: 3px;
  }

  .item-row .icon {
    font-size: 16px;
    width: 20px;
    height: 20px;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .item-row .icon img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    background: var(--gold);
    color: var(--wood-dark);
    border: none;
    padding: 14px 32px;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 0 5px 0 var(--accent), 0 8px 12px rgba(0,0,0,0.3);
    transition: all 0.1s;
    text-transform: uppercase;
  }

  .btn:hover, .btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--accent), 0 4px 8px rgba(0,0,0,0.3);
  }

  .btn-secondary {
    background: var(--wood);
    color: var(--shell);
    box-shadow: 0 5px 0 var(--wood-dark), 0 8px 12px rgba(0,0,0,0.3);
    margin-top: 12px;
    font-size: 12px;
  }
  .btn-secondary:hover, .btn-secondary:active {
    box-shadow: 0 2px 0 var(--wood-dark), 0 4px 8px rgba(0,0,0,0.3);
  }

  #nickname-input {
    font-family: 'VT323', monospace;
    font-size: 28px;
    padding: 12px 20px;
    border-radius: 6px;
    border: 3px solid var(--wood-dark);
    background: var(--shell);
    color: var(--wood-dark);
    text-align: center;
    margin-bottom: 20px;
    width: 280px;
    max-width: 90%;
    outline: none;
  }
  #nickname-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(255, 195, 0, 0.5);
  }

  #player-greeting {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .ranking-list {
    background: rgba(255, 248, 220, 0.05);
    border: 2px solid var(--wood);
    border-radius: 6px;
    padding: 12px;
    margin: 16px 0;
    width: 320px;
    max-width: 90%;
    max-height: 320px;
    overflow-y: auto;
    text-align: left;
  }

  .ranking-row {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    margin-bottom: 4px;
    background: rgba(139, 90, 43, 0.3);
    border-radius: 4px;
    font-family: 'VT323', monospace;
    color: var(--shell);
    gap: 12px;
  }
  .ranking-row.gold { background: rgba(255, 195, 0, 0.3); border: 1px solid var(--gold); }
  .ranking-row.silver { background: rgba(192, 192, 192, 0.2); border: 1px solid #c0c0c0; }
  .ranking-row.bronze { background: rgba(205, 127, 50, 0.25); border: 1px solid #cd7f32; }
  .ranking-row.you { box-shadow: 0 0 8px var(--gold); }

  .ranking-rank {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--gold);
    min-width: 32px;
  }
  .ranking-name {
    flex: 1;
    font-size: 20px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ranking-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--shell);
  }
  .ranking-empty {
    text-align: center;
    color: rgba(255, 248, 220, 0.5);
    padding: 20px;
    font-size: 18px;
  }

  .stats {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--shell);
    margin: 16px 0 28px;
    line-height: 1.8;
  }

  .stats .big {
    font-size: 52px;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent);
    display: block;
    font-family: 'Press Start 2P', monospace;
  }

  .new-record {
    color: var(--accent);
    animation: blink 0.6s infinite;
    letter-spacing: 2px;
    font-size: 14px;
    margin-top: 8px;
    font-family: 'Press Start 2P', monospace;
  }

  @keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0.3; }
  }

  .evo-flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .evo-flash.show { animation: evoFlash 1.4s ease-out; }
  .evo-flash .text {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent), 6px 6px 0 var(--wood-dark);
    background: rgba(43, 24, 16, 0.85);
    padding: 16px 24px;
    border-radius: 8px;
    letter-spacing: 2px;
    white-space: pre-line;
    line-height: 1.6;
  }
  @keyframes evoFlash {
    0% { opacity: 0; transform: scale(0.5); }
    25% { opacity: 1; transform: scale(1.15); }
    75% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-block">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">BEST</div>
      <div class="hud-value" id="best">0</div>
    </div>
  </div>

  <div class="evo-gauge-wrap" id="evo-gauge-wrap">
    <span class="evo-gauge-label" id="evo-gauge-label">EGG → HATCHING</span>
    <div class="evo-gauge-bar">
      <div class="evo-gauge-fill" id="evo-gauge-fill" style="width: 0%"></div>
      <div class="evo-gauge-pips">
        <div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>
      </div>
    </div>
  </div>

  <button class="sound-toggle" id="sound-toggle">♪</button>

  <div class="egg-cooldown" id="egg-cooldown">
    <span>🥚</span>
    <div class="bar"><div class="fill" id="egg-fill"></div></div>
  </div>

  <div class="power-bar" id="power-bar"></div>
  <div class="version-badge">1.4ver</div>

  <div class="overlay" id="nickname-screen">
    <div class="title">CHICK<br>QUEST</div>
    <div class="subtitle">// 닉네임을 입력하세요 //</div>
    <input type="text" id="nickname-input" maxlength="10" placeholder="닉네임 (최대 10자)" />
    <button class="btn" id="nickname-confirm">확인</button>
  </div>

  <div class="overlay hidden" id="start-screen">
    <div class="title">CHICK<br>QUEST</div>
    <div class="subtitle">// 알에서 꼬끼오까지 //</div>

    <div class="evo-show">
      <img id="preview-egg" alt="egg" />
      <span class="evo-arrow">→</span>
      <img id="preview-hatching" alt="hatching" />
      <span class="evo-arrow">→</span>
      <img id="preview-chick" alt="chick" />
      <span class="evo-arrow">→</span>
      <img id="preview-chicken" alt="chicken" />
    </div>

    <div class="controls-hint">
      <span>드래그</span> 자유 이동 (상하좌우)<br>
      <span>TAP / SPACE</span> 달걀 발사 (닭일 때)<br>
      <span>모바일</span> 닭은 드래그 중 자동 발사<br>
      각 단계마다 다른 음식을 모으면 진화!
    </div>

    <div class="item-legend">
      <div class="item-row"><span class="icon" data-icon="sun">☀️</span> 햇빛 (알 부화)</div>
      <div class="item-row"><span class="icon" data-icon="grain">🌾</span> 곡식 (병아리로)</div>
      <div class="item-row"><span class="icon" data-icon="worm">🪱</span> 지렁이 (닭으로)</div>
      <div class="item-row"><span class="icon" data-icon="corn">🌽</span> 옥수수 +80</div>
      <div class="item-row"><span class="icon" data-icon="shield">🛡️</span> 쉴드 무적</div>
      <div class="item-row"><span class="icon" data-icon="magnet">🧲</span> 자석 흡입</div>
      <div class="item-row"><span class="icon" data-icon="bomb">💣</span> 폭탄 제거</div>
      <div class="item-row"><span class="icon" data-icon="double">✨</span> 점수 2배</div>
    </div>

    <div id="player-greeting"></div>

    <button class="btn" id="start-btn">START</button>
    <button class="btn btn-secondary" id="show-ranking-btn">🏆 랭킹</button>
    <button class="btn btn-secondary" id="change-nickname-btn">닉네임 변경</button>
  </div>

  <div class="overlay hidden" id="ranking-screen">
    <div class="title">🏆 랭킹</div>
    <div id="ranking-list" class="ranking-list"></div>
    <button class="btn" id="ranking-back-btn">뒤로</button>
    <button class="btn btn-secondary" id="ranking-change-nickname-btn">닉네임 변경</button>
    <button class="btn btn-secondary" id="ranking-clear-btn">내 기록 초기화</button>
  </div>

  <div class="overlay hidden" id="end-screen">
    <div class="title">GAME<br>OVER</div>
    <div class="stats">
      SCORE
      <span class="big" id="final-score">0</span>
      <span id="record-msg"></span>
    </div>
    <button class="btn" id="restart-btn">RETRY</button>
    <button class="btn btn-secondary" id="endscreen-ranking-btn">🏆 랭킹 보기</button>
  </div>

  <div class="evo-flash" id="evo-flash"><div class="text" id="evo-text"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(() => {
  // ============ AUDIO ============
  const Audio = (() => {
    let ctx = null, masterGain, musicGain, sfxGain;
    let muted = false;
    let musicPlaying = false, musicScheduler = null;
    let nextNoteTime = 0, stepIdx = 0;

    try { if (localStorage.getItem('chick-quest-muted') === '1') muted = true; } catch(e) {}

    function init() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      masterGain = ctx.createGain();
      masterGain.gain.value = muted ? 0 : 0.6;
      masterGain.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.15;
      musicGain.connect(masterGain);
      sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.5;
      sfxGain.connect(masterGain);
    }
    function ensure() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
    function setMuted(m) {
      muted = m;
      try { localStorage.setItem('chick-quest-muted', m ? '1' : '0'); } catch(e) {}
      if (masterGain) masterGain.gain.value = m ? 0 : 0.6;
    }

    function playSample(name) {
      if (muted || !SAMPLE_SFX[name]) return;
      const a = new window.Audio(SAMPLE_SFX[name]);
      a.volume = 0.75;
      a.play().catch(() => {});
    }
    function tone({ freq=440, type='square', dur=0.1, vol=0.3, slide=0, attack=0.005 }) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(sfxGain);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function noise({ dur=0.2, vol=0.3, freq=1000 }) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(sfxGain);
      src.start(t); src.stop(t + dur + 0.05);
    }

    const SFX = {
      corn: () => {
        tone({ freq: 700, type: 'square', dur: 0.05, vol: 0.18 });
        setTimeout(() => tone({ freq: 1000, type: 'square', dur: 0.06, vol: 0.18 }), 35);
      },
      worm: () => {
        tone({ freq: 400, type: 'sine', dur: 0.06, vol: 0.18 });
        setTimeout(() => tone({ freq: 600, type: 'sine', dur: 0.08, vol: 0.18 }), 50);
      },
      evolve: () => {
        for (let i = 0; i < 6; i++) {
          setTimeout(() => tone({ freq: 392 + i * 80, type: 'square', dur: 0.1, vol: 0.18 }), i * 70);
        }
      },
      // Egg cracking sounds (when getting sun, occasional crack tic)
      crackTic: () => {
        noise({ dur: 0.05, vol: 0.2, freq: 4000 });
      },
      // Big crack when egg fully hatches
      hatchCrack: () => {
        // Multiple cracks then a chirp
        noise({ dur: 0.06, vol: 0.3, freq: 4000 });
        setTimeout(() => noise({ dur: 0.06, vol: 0.3, freq: 3500 }), 80);
        setTimeout(() => noise({ dur: 0.08, vol: 0.35, freq: 3000 }), 170);
        setTimeout(() => {
          // Tiny chirp emerging
          tone({ freq: 1200, type: 'sine', dur: 0.08, vol: 0.2, slide: 600 });
        }, 280);
      },
      peepBirth: () => playSample('chick'),
      peepDeath: () => playSample('chick'),
      crowBirth: () => playSample('chicken'),

      egg: () => tone({ freq: 600, type: 'triangle', dur: 0.08, vol: 0.2, slide: 200 }),
      eggHit: () => {
        noise({ dur: 0.15, vol: 0.3, freq: 800 });
        tone({ freq: 200, type: 'square', dur: 0.1, vol: 0.15 });

      shield: () => {

      magnet: () => tone({ freq: 200, type: 'sawtooth', dur: 0.3, vol: 0.18, slide: 300 }),

    function play(name) {
      ensure();
      if (!ctx || muted || !SFX[name]) return;
      try {

    const C4=261.63, D4=293.66, E4=329.63, F4=349.23, G4=392, A4=440, B4=493.88, C5=523.25;
    const melody = [
      C5, G4, E4, G4, C5, G4, E4, G4,
      A4, F4, C4, F4, A4, F4, C4, F4,
      G4, E4, C4, E4, G4, E4, C4, E4,

    ];
    const bass = [C4, C4, G4/2, G4/2, F4, F4, G4/2, G4/2];
    const BPM = 110;
    const stepDur = 60 / BPM / 2;

    function playMelody(freq, time) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.1, time + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, time + stepDur * 0.9);
      o.connect(g); g.connect(musicGain);
      o.start(time); o.stop(time + stepDur);
    }

    function playBass(freq, time) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(0.2, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + stepDur * 4 * 0.9);
      o.connect(g); g.connect(musicGain);
      o.start(time); o.stop(time + stepDur * 4);
    }

    function scheduleStep() {
      if (!musicPlaying || !ctx) return;
      while (nextNoteTime < ctx.currentTime + 0.15) {
        playMelody(melody[stepIdx % 32], nextNoteTime);
        if (stepIdx % 4 === 0) playBass(bass[Math.floor(stepIdx / 4) % 8], nextNoteTime);
        nextNoteTime += stepDur;
        stepIdx++;
      }
    }

    function startMusic() {
      ensure();
      if (!ctx || musicPlaying) return;
      musicPlaying = true;
      stepIdx = 0;
      nextNoteTime = ctx.currentTime + 0.05;
      musicScheduler = setInterval(scheduleStep, 50);
    }
    function stopMusic() {
      musicPlaying = false;
      if (musicScheduler) { clearInterval(musicScheduler); musicScheduler = null; }
    }
    return { ensure, play, setMuted, isMuted, startMusic, stopMusic };
  })();

  const SPRITE_IMAGES = {};
  let spritesLoaded = 0;
  const totalSprites = Object.keys(SPRITE_DATA).length;
  let allSpritesReady = false;

  function loadSprites(callback) {
    for (const name in SPRITE_DATA) {
      const img = new Image();
      img.onload = () => {
        spritesLoaded++;
        if (spritesLoaded === totalSprites) {
          allSpritesReady = true;
          if (callback) callback();
        }
      };
      img.onerror = () => {
        console.warn('Failed to load sprite:', name);
        spritesLoaded++;
        if (spritesLoaded === totalSprites) {
          allSpritesReady = true;
          if (callback) callback();
        }
      };
      img.src = SPRITE_DATA[name];
      SPRITE_IMAGES[name] = img;
    }
  }

  // Backwards-compat name kept (drawEmoji) — now draws sprite by name
  function drawEmoji(ctx, name, cx, cy, size, rotation = 0) {
    const img = SPRITE_IMAGES[name];
    if (!img || !img.complete || img.naturalWidth === 0) return;
    // Maintain aspect ratio: scale longest side to `size`
    const aspect = img.naturalWidth / img.naturalHeight;
    let w, h;
    if (aspect >= 1) { w = size; h = size / aspect; }
    else { w = size * aspect; h = size; }
    if (rotation !== 0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(img, cx - w/2, cy - h/2, w, h);
    }
  }

  function renderPowerBar() {

  function updateEggCooldownUI() {
    if (player.stage === MAX_STAGE) {
      eggCooldown.classList.add('show');

      eggFill.style.width = pct + '%';

      eggCooldown.classList.remove('show');

  function updateEvoGauge() {
    if (player.stage >= MAX_STAGE) {
      evoGaugeWrap.classList.add('hidden');
      return;
    }
    evoGaugeWrap.classList.remove('hidden');
    const stage = STAGES[player.stage];
    const food = stage.food;
    const foodEmoji = food ? food.emoji : '';
    const required = stage.required;
    evoGaugeLabel.textContent = `${foodEmoji} ${player.wormCount}/${required}`;
    const pct = (player.wormCount / required) * 100;
    evoGaugeFill.style.width = pct + '%';
    if (player.wormCount >= required - 1) evoGaugeWrap.classList.add('maxed');
    else evoGaugeWrap.classList.remove('maxed');
  }

    Audio.play('egg');
  }

  function addParticles(x, y, color, count = 15, speed = 5) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
    }
  }

  function evolve() {
    if (player.stage >= MAX_STAGE) return;
    player.stage++;
    player.wormCount = 0;
    // Stage-specific evolution sound
    // 0(egg) just evolved -> stage now 1(hatching): hatching crack sound
    // 1(hatching) -> 2(chick): peep peep
    // 2(chick) -> 3(chicken): cock-a-doodle-doo
    if (player.stage === 1) {
      Audio.play('hatchCrack');
    } else if (player.stage === 2) {
      Audio.play('peepBirth');
    } else if (player.stage === 3) {
      Audio.play('crowBirth');
    } else {
      Audio.play('evolve');
    }
    addParticles(player.x, player.y, '255, 215, 0', 35, 8);
    addParticles(player.x, player.y, '255, 138, 0', 25, 6);
    const newStage = STAGES[player.stage];
    let msg = newStage.label + '!';
    if (newStage.food) {
      msg += '\n다음: ' + newStage.food.emoji;
    }
    evoText.textContent = msg;
    evoFlash.classList.remove('show');
    void evoFlash.offsetWidth;
    evoFlash.classList.add('show');
    setTimeout(() => evoFlash.classList.remove('show'), 1400);
    updateEvoGauge();
    foodTimer = 60;
  }

  function pickupFood(x, y, particleColor) {
    addParticles(x, y, particleColor || '224, 122, 138', 22, 6);
    Audio.play('worm');
    if (player.stage >= MAX_STAGE) {
      addScore(120);
      return;
    }
    addScore([8, 14, 22][player.stage] || 10);
    player.wormCount++;
    // For egg stage, play occasional crack sounds at milestones
    if (player.stage === 0) {
      const crackPoints = [5, 10, 14, 17, 19, 20]; // sounds get more frequent near hatching
      if (crackPoints.includes(player.wormCount)) {
        setTimeout(() => Audio.play('crackTic'), 150);
      }
    }
    if (player.wormCount >= STAGES[player.stage].required) evolve();
    else updateEvoGauge();
  }

  function pickupItem(type, x, y) {
    const item = ITEMS[type];
    addParticles(x, y, '255, 215, 0', 25, 6);
    Audio.play(item.sfx);
    if (type === 'bomb') {
      shockwaves.push({ x: player.x, y: player.y, r: 10, max: Math.max(W, H) });
      for (const o of obstacles) addParticles(o.x + o.w/2, o.y + o.h/2, '255, 140, 60', 8, 4);
      obstacles.length = 0;
    } else {
      active[type] = item.duration;
    }
    renderPowerBar();
  }

  function input() {
    const speed = 5.5;
    if (touchX !== null) {
      const dx = touchX - player.x;
      player.x += Math.sign(dx) * Math.min(Math.abs(dx), speed * 1.4);
      if (touchY !== null) {
        const dy = touchY - player.y;
        player.y += Math.sign(dy) * Math.min(Math.abs(dy), speed * 1.4);
      }
    } else {
      if (keys.left) player.x -= speed;
      if (keys.right) player.x += speed;
      if (keys.up) player.y -= speed;
      if (keys.down) player.y += speed;
    }
    const halfW = getPlayerSize() / 2;
    const halfH = getPlayerSize() / 2;
    player.x = Math.max(halfW, Math.min(W - halfW, player.x));
    // Vertical: allow movement across the full playable screen.
    const minY = halfH;
    const maxY = H - 40 - halfH; // 40px ground + half player
    player.y = Math.max(minY, Math.min(maxY, player.y));
  }

  // Tight collision: circle (player) vs rect (obstacle's collision box)
  function checkCollision(px, py, pr, ox, oy, ow, oh, collW, collH) {
    // Compute the obstacle's tight collision rect (centered)
    const rx = ox + ow/2 - collW/2;
    const ry = oy + oh/2 - collH/2;
    const cx = Math.max(rx, Math.min(px, rx + collW));
    const cy = Math.max(ry, Math.min(py, ry + collH));
    const dx = px - cx;
    const dy = py - cy;
    return dx * dx + dy * dy < pr * pr;
  }

  function update() {
    if (!running) return;
    frame++;

    addScore(STAGE_SCORE_RATE[player.stage] || 1);

    let needRender = false;
    for (const k of ['shield', 'magnet', 'double']) {
      if (active[k] > 0) {
        const before = Math.ceil(active[k] / 60);
        active[k]--;
        const after = Math.ceil(active[k] / 60);
        if (before !== after) needRender = true;
      }
    }
    if (needRender) renderPowerBar();

    if (eggCooldownFrames > 0) eggCooldownFrames--;
    updateEggCooldownUI();

    player.flapPhase += 0.2;

    // Slower speed ramp for fairness
    gameSpeed = 2.0 + score * 0.0008;

    // === DIFFICULTY: Grace period at start ===
    // First 4 seconds: only stones spawn (no predators)
    // First 2 seconds: nothing dangerous spawns at all
    const gracePeriod = frame < 120; // 2 seconds
    const stonesOnly = frame < 240;  // first 4 seconds: only stones

    spawnTimer++;
    const spawnRate = Math.max(22, 60 - score * 0.010);
    if (!gracePeriod && spawnTimer > spawnRate) {
      spawnTimer = 0;
      spawnObstacle(stonesOnly);
      if (Math.random() < 0.20 && score > 400) spawnObstacle(stonesOnly);
    }

    cornTimer++;
    if (cornTimer > 100) { cornTimer = 0; if (Math.random() < 0.7) spawnCorn(); }

    // === DIFFICULTY: Food spawns - tuned per stage ===
    foodTimer++;
    // Egg needs 21 suns -> spawn fast (every ~1s when active)
    // Other stages need 4 -> spawn at moderate pace (~3s)
    let foodRate;
    if (player.stage === 0) {
      // Egg: very fast suns, even faster right after stage start
      foodRate = player.wormCount === 0 ? 30 : 50;
    } else {
      foodRate = player.wormCount === 0 ? 60 : 180;
    }
    if (foodTimer > foodRate) {
      foodTimer = 0;
      if (Math.random() < 0.95) spawnFood();
    }

    itemTimer++;
    if (itemTimer > 480) { itemTimer = 0; if (Math.random() < 0.85) spawnItem(); }

    input();
    if (touchX !== null && player.stage === MAX_STAGE) shootEgg();

    for (const c of clouds) {
      c.x -= c.speed;
      if (c.x + c.w < 0) { c.x = W + 20; c.y = 50 + Math.random() * (H - 200); }
    }

    // Eggs (projectiles)
    for (let i = eggs.length - 1; i >= 0; i--) {
      const e = eggs[i];
      e.y += e.vy;
      e.rot += 0.4;
      if (e.y < -30) { eggs.splice(i, 1); continue; }
      for (let j = obstacles.length - 1; j >= 0; j--) {
        const o = obstacles[j];
        let effX = o.x;
        if (o.kind === 'predator' && !o.isLong) effX = o.x + Math.sin(o.wigglePhase) * 8;
        if (e.x > effX && e.x < effX + o.w && e.y > o.y && e.y < o.y + o.h) {
          addParticles(e.x, e.y, '255, 248, 220', 12, 4);
          addParticles(effX + o.w/2, o.y + o.h/2,
            o.kind === 'stone' ? '127, 140, 141' : '160, 100, 60', 12, 4);
          Audio.play('eggHit');
          if (['magpie', 'owl', 'hawk'].includes(o.type)) spawnItemAt(effX + o.w/2, o.y + o.h/2);
          obstacles.splice(j, 1);
          eggs.splice(i, 1);
          addScore(o.kind === 'predator' ? 55 : 30);
          break;
        }
      }
    }

    // Obstacles
    const pr = getPlayerRadius();
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += o.vy;
      if (o.kind === 'predator' && !o.isLong) o.wigglePhase += 0.06;
      if (o.y > H + 80) { obstacles.splice(i, 1); continue; }

      let effX = o.x;
      if (o.kind === 'predator' && !o.isLong) effX = o.x + Math.sin(o.wigglePhase) * 8;

      if (checkCollision(player.x, player.y, pr, effX, o.y, o.w, o.h, o.collW, o.collH)) {
        if (active.shield > 0) {
          addParticles(effX + o.w/2, o.y + o.h/2, '93, 173, 226', 15, 5);
          Audio.play('shieldHit');
          obstacles.splice(i, 1);
        } else {
          gameOver();
          return;
        }
      }
    }

    // Corn (with magnet - STRONG pull)
    const magnetRange = active.magnet > 0 ? 280 : 0;
    for (let i = corns.length - 1; i >= 0; i--) {
      const c = corns[i];
      c.bob += 0.15;
      if (magnetRange > 0) {
        const dx = player.x - c.x;
        const dy = player.y - c.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        if (dist < magnetRange) {
          // Pull strength scales up dramatically as items get closer
          const pull = 4 + (1 - dist / magnetRange) * 14;
          c.x += (dx / dist) * pull;
          c.y += (dy / dist) * pull;
        } else { c.y += c.vy; }
      } else { c.y += c.vy; }
      if (c.y > H + 30) { corns.splice(i, 1); continue; }
      const dx = player.x - c.x;
      const dy = player.y - c.y;
      if (dx * dx + dy * dy < (pr + c.r) ** 2) {
        addScore(80);
        addParticles(c.x, c.y, '244, 208, 63', 18);
        Audio.play('corn');
        corns.splice(i, 1);
      }
    }

    // Foods (stage-specific evolution food, with magnet pull)
    for (let i = foods.length - 1; i >= 0; i--) {
      const m = foods[i];
      m.bob += 0.1;
      // If player evolved past this food's stage, fade it out
      if (m.forStage !== undefined && m.forStage !== player.stage) {
        m.life = (m.life || 1) - 0.05;
        if (m.life <= 0) { foods.splice(i, 1); continue; }
      }
      if (magnetRange > 0) {
        const dx = player.x - m.x;
        const dy = player.y - m.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        if (dist < magnetRange) {
          const pull = 4 + (1 - dist / magnetRange) * 14;
          m.x += (dx / dist) * pull;
          m.y += (dy / dist) * pull;
        } else { m.y += m.vy; }
      } else { m.y += m.vy; }
      if (m.y > H + 30) { foods.splice(i, 1); continue; }
      const dx = player.x - m.x;
      const dy = player.y - m.y;
      if (dx * dx + dy * dy < (pr + m.r) ** 2) {
        // Only pickup if it matches current stage (or has no stage tag)
        if (m.forStage === undefined || m.forStage === player.stage) {
          pickupFood(m.x, m.y, m.particleColor);
        }
        foods.splice(i, 1);
      }
    }

    // Power items (also magnetic now!)
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.bob += 0.1;
      if (magnetRange > 0) {
        const dx = player.x - it.x;
        const dy = player.y - it.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        if (dist < magnetRange) {
          const pull = 3 + (1 - dist / magnetRange) * 10;
          it.x += (dx / dist) * pull;
          it.y += (dy / dist) * pull;
        } else { it.y += it.vy; }
      } else { it.y += it.vy; }
      if (it.y > H + 30) { items.splice(i, 1); continue; }
      const dx = player.x - it.x;
      const dy = player.y - it.y;
      if (dx * dx + dy * dy < (pr + it.r) ** 2) {
        pickupItem(it.type, it.x, it.y);
        items.splice(i, 1);
      }
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.r += 25;
      if (s.r > s.max) shockwaves.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.025;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#ffd7a8');
    sky.addColorStop(0.45, '#f6b5b9');
    sky.addColorStop(0.72, '#fff4b8');
    sky.addColorStop(1, '#b7e4c7');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const sunX = W * 0.78 + Math.sin(frame * 0.003) * 12;
    const sunY = H * 0.18;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 90);
    sunGlow.addColorStop(0, 'rgba(255, 238, 156, 0.75)');
    sunGlow.addColorStop(1, 'rgba(255, 238, 156, 0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 90, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(109, 190, 151, 0.28)';
    for (let x = -40; x < W + 80; x += 90) {
      ctx.beginPath();
      ctx.ellipse(x + Math.sin(frame * 0.004 + x) * 10, H - 74, 78, 30, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(72, 149, 114, 0.22)';
    for (let x = -20; x < W + 80; x += 70) {
      ctx.beginPath();
      ctx.ellipse(x - (frame * 0.08 % 70), H - 42, 54, 20, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCloud(x, y, w) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
    const px = Math.max(2, w / 16);
    ctx.fillRect(x + px*4, y, px*8, px*2);
    ctx.fillRect(x + px*2, y + px*2, px*12, px*2);
    ctx.fillRect(x, y + px*4, px*16, px*2);
    ctx.fillRect(x + px*2, y + px*6, px*12, px*2);
    ctx.fillStyle = 'rgba(255, 235, 220, 0.38)';
    ctx.fillRect(x + px*3, y + px*6, px*10, px);
  }

  function drawGround() {
    const groundH = 24;
    ctx.fillStyle = '#52b788';
    ctx.fillRect(0, H - groundH, W, groundH);
    ctx.fillStyle = '#95d5b2';
    for (let x = 0; x < W; x += 8) {
      const off = Math.sin((x + frame * 2) * 0.05) * 2;
      ctx.fillRect(x, H - groundH - 2 + off, 4, 4);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    for (const c of clouds) drawCloud(c.x, c.y, c.w);
    drawGround();

    for (const s of shockwaves) {
      const alpha = 1 - s.r / s.max;
      ctx.strokeStyle = `rgba(255, 140, 60, ${alpha})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (const p of particles) {
      ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
      ctx.fillRect(Math.floor(p.x - 2), Math.floor(p.y - 2), 4, 4);
    }

    // Obstacles
    for (const o of obstacles) {
      let drawX = o.x + o.w/2;
      const drawY = o.y + o.h/2;
      let rot = o.rot || 0;
      if (o.kind === 'predator' && !o.isLong) {
        // Stronger wiggle for menace
        drawX = o.x + o.w/2 + Math.sin(o.wigglePhase) * 12;
        // Dark menacing shadow underneath
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(drawX, drawY + o.h * 0.35, o.w * 0.45, o.h * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        // Pulsing red danger aura
        const pulse = 0.6 + Math.sin(frame * 0.18) * 0.3;
        const grad = ctx.createRadialGradient(drawX, drawY, o.w * 0.2, drawX, drawY, o.w * 0.7);
        grad.addColorStop(0, `rgba(220, 30, 30, ${0.35 * pulse})`);
        grad.addColorStop(1, 'rgba(220, 30, 30, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(drawX, drawY, o.w * 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.kind === 'predator' && o.isLong) {
        // Snake: dark green aura + slither shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(drawX, drawY + o.h * 0.5, o.w * 0.4, o.h * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();
        const pulse = 0.6 + Math.sin(frame * 0.15) * 0.3;
        const grad = ctx.createRadialGradient(drawX, drawY, o.w * 0.15, drawX, drawY, o.w * 0.55);
        grad.addColorStop(0, `rgba(150, 30, 30, ${0.3 * pulse})`);
        grad.addColorStop(1, 'rgba(150, 30, 30, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(drawX, drawY, o.w * 0.55, o.h * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      drawEmoji(ctx, o.emoji, drawX, drawY, Math.max(o.w, o.h), rot);

      // Red glowing eye dots for predators (overlay on top of emoji for menace)
      if (o.kind === 'predator') {
        const eyeFlicker = Math.sin(frame * 0.3 + o.wigglePhase) * 0.5 + 0.5;
        if (eyeFlicker > 0.3) {
          // Two small red dots floating above for "glowing eyes" feel
          ctx.fillStyle = `rgba(255, 30, 30, ${0.7 + eyeFlicker * 0.3})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = 'red';
          const ex = o.isLong ? drawX - o.w * 0.25 : drawX;
          const ey = o.isLong ? drawY - o.h * 0.15 : drawY - o.h * 0.05;
          ctx.beginPath();
          ctx.arc(ex - 4, ey, 1.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex + 4, ey, 1.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }

    // Corn
    for (const c of corns) {
      const bob = Math.sin(c.bob) * 2;
      drawEmoji(ctx, 'corn', c.x, c.y + bob, 32);
    }

    // Foods (stage-specific evolution items)
    for (const m of foods) {
      const bob = Math.sin(m.bob) * 2;
      const alpha = m.life !== undefined ? m.life : 1;
      ctx.globalAlpha = alpha;
      // Glow color matches the food's particle color
      ctx.fillStyle = `rgba(${m.particleColor}, 0.4)`;
      ctx.beginPath();
      ctx.arc(m.x, m.y + bob, 22 + Math.sin(frame * 0.1) * 3, 0, Math.PI * 2);
      ctx.fill();
      drawEmoji(ctx, m.emoji, m.x, m.y + bob, 38);
      ctx.globalAlpha = 1;
    }

    // Items (with white glow)
    for (const it of items) {
      const bob = Math.sin(it.bob) * 2;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.beginPath();
      ctx.arc(it.x, it.y + bob, 22, 0, Math.PI * 2);
      ctx.fill();
      drawEmoji(ctx, ITEMS[it.type].emoji, it.x, it.y + bob, 36);
    }

    // Magnet aura
    if (active.magnet > 0) {
      const pulse = 0.5 + Math.sin(frame * 0.1) * 0.3;
      ctx.strokeStyle = `rgba(125, 60, 152, ${pulse * 0.5})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.arc(player.x, player.y, 200, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Player eggs (projectiles)
    for (const e of eggs) {
      drawEmoji(ctx, 'egg', e.x, e.y, 28, e.rot);
    }

    // Player
    const stage = STAGES[player.stage];
    const sz = stage.size;
    const flap = Math.sin(player.flapPhase) * 3;
    drawEmoji(ctx, stage.emoji, player.x, player.y + flap, sz);

    // Egg-stage warmth glow + visible crack lines as 21 suns are gathered
    if (player.stage === 0 && player.wormCount > 0) {
      const progress = player.wormCount / STAGES[0].required;
      // Warm aura that grows
      const warmth = 0.2 + progress * 0.5;
      const grad = ctx.createRadialGradient(
        player.x, player.y + flap, sz * 0.1,
        player.x, player.y + flap, sz * 0.9
      );
      grad.addColorStop(0, `rgba(255, 220, 100, ${warmth * 0.4})`);
      grad.addColorStop(1, 'rgba(255, 220, 100, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(player.x, player.y + flap, sz * 0.9, 0, Math.PI * 2);
      ctx.fill();

      // Cracks appear gradually after about 50% progress
      if (progress > 0.5) {
        ctx.save();
        ctx.translate(player.x, player.y + flap);
        ctx.strokeStyle = 'rgba(60, 40, 20, 0.7)';
        ctx.lineWidth = 1.5;
        const cracks = Math.floor((progress - 0.5) * 8); // 0..4 cracks
        const crackPaths = [
          [[-0.15, -0.1], [-0.05, 0.0], [-0.1, 0.15]],
          [[0.18, -0.05], [0.08, 0.05], [0.15, 0.2]],
          [[-0.05, -0.25], [0.0, -0.15], [-0.08, -0.05]],
          [[0.05, 0.2], [0.12, 0.08], [0.0, 0.0]]
        ];
        for (let i = 0; i < cracks && i < crackPaths.length; i++) {
          const path = crackPaths[i];
          ctx.beginPath();
          ctx.moveTo(path[0][0] * sz, path[0][1] * sz);
          for (let j = 1; j < path.length; j++) {
            ctx.lineTo(path[j][0] * sz, path[j][1] * sz);
          }
          ctx.stroke();
        }
        ctx.restore();

        // Wiggle the egg slightly when nearly hatching
        if (progress > 0.85) {
          // override last drawn position by re-drawing slightly shifted
          // (Simpler approach: just add visual shake by drawing again with offset)
          // Skipping for simplicity - the cracks alone communicate it
        }
      }
    }

    // Shield bubble
    if (active.shield > 0) {
      const flash = active.shield < 60 && Math.floor(frame / 6) % 2 === 0;
      const alpha = flash ? 0.4 : 0.8;
      ctx.strokeStyle = `rgba(93, 173, 226, ${alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, sz/2 + 8 + Math.sin(frame * 0.15) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = `rgba(93, 173, 226, 0.15)`;
      ctx.beginPath();
      ctx.arc(player.x, player.y, sz/2 + 8, 0, Math.PI * 2);
      ctx.fill();
    }

    if (active.double > 0) {
      ctx.fillStyle = 'rgba(233, 30, 99, 0.95)';
      ctx.font = 'bold 14px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('×2', player.x, player.y - sz/2 - 8);
    }
  }

  function updateDeath() {
    deathFrame++;

    // Update existing particles/shockwaves still
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.025;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Update death FX
    for (let i = deathFx.length - 1; i >= 0; i--) {
      const f = deathFx[i];
      if (f.type === 'shell' || f.type === 'yolk') {
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.4; // gravity
        f.vx *= 0.99;
        if (f.type === 'shell') f.rot += f.rotSpeed;
        // Stop on ground
        if (f.y > H - 30) {
          f.y = H - 30;
          f.vy = 0;
          f.vx *= 0.7;
        }
        f.life -= 0.005;
      } else if (f.type === 'star') {
        f.angle += 0.15;
      }
      if (f.life <= 0) deathFx.splice(i, 1);
    }

    // Player physics for chick/chicken death
    if (player.stage >= 2 && player.isDead) {
      player.x += player.vx;
      player.y += player.vy;
      player.vy += 0.5; // gravity
      player.rotation += player.rotSpeed;
      // Bounce on ground once
      if (player.y > H - 50 && player.vy > 0) {
        player.y = H - 50;
        if (Math.abs(player.vy) > 2) {
          player.vy = -player.vy * 0.4;
          player.vx *= 0.6;
        } else {
          player.vy = 0;
          player.vx = 0;
          player.rotSpeed *= 0.9;
        }
      }
    }
  }

  function drawDeath() {
    // Sky/clouds/ground
    drawBackground();
    for (const c of clouds) drawCloud(c.x, c.y, c.w);
    drawGround();

    // Particles
    for (const p of particles) {
      ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
      ctx.fillRect(Math.floor(p.x - 2), Math.floor(p.y - 2), 4, 4);
    }

    // Death FX
    for (const f of deathFx) {
      if (f.type === 'shell') {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        ctx.globalAlpha = Math.min(1, f.life * 2);
        // Draw shell shard - cream colored chunky piece
        ctx.fillStyle = '#fff8dc';
        ctx.strokeStyle = '#5d3a1a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-f.size/2, -f.size/3);
        ctx.lineTo(f.size/2, -f.size/4);
        ctx.lineTo(f.size/3, f.size/3);
        ctx.lineTo(-f.size/3, f.size/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
      } else if (f.type === 'yolk') {
        ctx.globalAlpha = Math.min(1, f.life * 2);
        if (f.color === 'yolk') {
          // Yolk - bright orange-yellow with darker outline
          const grad = ctx.createRadialGradient(f.x - f.size*0.2, f.y - f.size*0.2, 1, f.x, f.y, f.size);
          grad.addColorStop(0, '#ffe066');
          grad.addColorStop(1, '#ff9f1c');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Egg white - translucent
          ctx.fillStyle = 'rgba(255, 250, 220, 0.85)';
          ctx.beginPath();
          ctx.ellipse(f.x, f.y, f.size * 1.1, f.size * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    // Stars circling for chick/chicken
    if (player.stage >= 2 && player.isDead) {
      for (const f of deathFx) {
        if (f.type === 'star') {
          const sx = player.x + Math.cos(f.angle) * f.radius;
          const sy = player.y - 30 + Math.sin(f.angle) * f.radius * 0.4;
          ctx.font = '20px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('⭐', sx, sy);
        }
      }
    }

    // Draw the dead player
    if (player.stage >= 2 && player.isDead) {
      // Knocked-out chick/chicken: rotated, with X eyes overlay
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.rotation);
      const stage = STAGES[player.stage];
      drawEmoji(ctx, stage.emoji, 0, 0, stage.size);
      const sz = stage.size;
      // Eye positions (relative to center)
      const eyeY = -sz * 0.10;
      const eyeOffsetX = sz * 0.16;
      const eyeR = sz * 0.10;
      // Cover original eyes with yellow body color circles (matches chick/chicken yellow)
      ctx.fillStyle = '#ffd93b'; // chick yellow
      ctx.beginPath();
      ctx.arc(-eyeOffsetX, eyeY, eyeR + 1, 0, Math.PI * 2);
      ctx.arc(eyeOffsetX, eyeY, eyeR + 1, 0, Math.PI * 2);
      ctx.fill();
      // Draw X marks
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = Math.max(2, sz * 0.05);
      ctx.lineCap = 'round';
      // Left X
      ctx.beginPath();
      ctx.moveTo(-eyeOffsetX - eyeR*0.7, eyeY - eyeR*0.7);
      ctx.lineTo(-eyeOffsetX + eyeR*0.7, eyeY + eyeR*0.7);
      ctx.moveTo(-eyeOffsetX + eyeR*0.7, eyeY - eyeR*0.7);
      ctx.lineTo(-eyeOffsetX - eyeR*0.7, eyeY + eyeR*0.7);
      ctx.stroke();
      // Right X
      ctx.beginPath();
      ctx.moveTo(eyeOffsetX - eyeR*0.7, eyeY - eyeR*0.7);
      ctx.lineTo(eyeOffsetX + eyeR*0.7, eyeY + eyeR*0.7);
      ctx.moveTo(eyeOffsetX + eyeR*0.7, eyeY - eyeR*0.7);
      ctx.lineTo(eyeOffsetX - eyeR*0.7, eyeY + eyeR*0.7);
      ctx.stroke();
      // Tongue sticking out from beak
      ctx.fillStyle = '#ff5577';
      ctx.strokeStyle = '#cc3344';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, sz * 0.08, sz * 0.08, sz * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function loop() {
    if (dying) {
      ctx.clearRect(0, 0, W, H);
      updateDeath();
      drawDeath();
    } else {
      update();
      draw();
    }
    requestAnimationFrame(loop);
  }

  function startDeathAnimation() {
    dying = true;
    deathLocked = true;
    deathFrame = 0;
    deathFx = [];
    Audio.stopMusic();
    if (player.stage === 2) {
      Audio.play('peepDeath');
    } else if (player.stage === 3) {
      Audio.play('crowDeath');
    } else {
      Audio.play('gameOver');
    }

    if (player.stage <= 1) {
      // Egg/Hatching: Crack & yolk explosion
      // Shell pieces (broken egg shell shards)
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        deathFx.push({
          type: 'shell',
          x: player.x, y: player.y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 3,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.4,
          size: 10 + Math.random() * 8,
          life: 1
        });
      }
      // Yolk drops (yellow + white)
      for (let i = 0; i < 25; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 4;
        deathFx.push({
          type: 'yolk',
          x: player.x + (Math.random() - 0.5) * 20,
          y: player.y + (Math.random() - 0.5) * 20,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 2,
          color: Math.random() < 0.4 ? 'yolk' : 'white',
          size: 6 + Math.random() * 8,
          life: 1
        });
      }
      // Splat particles
      addParticles(player.x, player.y, '255, 200, 80', 20, 6);
      addParticles(player.x, player.y, '255, 240, 200', 15, 5);
      // Player sprite hidden during this death
      player.isDead = true;
    } else {
      // Chick/Chicken: knockout - launch up, spin, fall
      player.isDead = true;
      player.stunFrame = 0;
      player.vx = (Math.random() - 0.5) * 4;
      player.vy = -10; // initial pop up
      player.rotation = 0;
      player.rotSpeed = (Math.random() - 0.5) * 0.3;
      // Stars/birdies circling
      for (let i = 0; i < 6; i++) {
        deathFx.push({
          type: 'star',
          angle: (i / 6) * Math.PI * 2,
          radius: 30,
          life: 1
        });
      }
      addParticles(player.x, player.y, '255, 215, 0', 25, 6);
    }

    // Show game over UI after animation completes
    const resultScore = finalScoreSnapshot;
    setTimeout(() => {
      finalizeGameOver(resultScore);
    }, 1800);
  }

  function normalizeRankings(arr) {
    const bestByName = new Map();
    for (const r of (Array.isArray(arr) ? arr : [])
      .map(r => ({
        ...r,
        name: String(r.name || '???').slice(0, 10),
        score: Number(r.score) || 0,
        date: Number(r.date) || 0
      }))
      .filter(r => r.score > 0)) {
      const prev = bestByName.get(r.name);
      if (!prev || r.score > prev.score || (r.score === prev.score && r.date < prev.date)) {
        bestByName.set(r.name, r);
      }
    }
    return [...bestByName.values()]
      .sort((a, b) => b.score - a.score || a.date - b.date);
  }

  function getRankings() {
    try {
      const raw = localStorage.getItem('chick-quest-rankings');
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return normalizeRankings(arr);
    } catch(e) { return []; }
  }

  function saveRankings(arr) {
    try {
      localStorage.setItem('chick-quest-rankings', JSON.stringify(arr));
    } catch(e) {}
  }

  async function addRanking(name, score) {
    const rankings = getRankings();
    const record = { name: name.slice(0, 10), score: Math.floor(score), date: Date.now() };
    rankings.push(record);
    // Keep top 50
    const top = normalizeRankings(rankings).slice(0, 50);
    saveRankings(top);
    const onlineId = await saveOnlineRanking(record);
    const onlineRankings = onlineId ? await getOnlineRankings() : null;
    return { record, localRankings: top, onlineId, onlineRankings };
  }

  async function saveOnlineRanking(record) {
    if (!firestoreDb) return;
    try {
      const sameName = await firestoreDb.collection('rankings')
        .where('name', '==', record.name)
        .get();
      let bestDoc = null;
      sameName.forEach(doc => {
        const data = doc.data() || {};
        const savedScore = Number(data.score) || 0;
        const savedDate = Number(data.date) || 0;
        if (!bestDoc || savedScore > bestDoc.score || (savedScore === bestDoc.score && savedDate < bestDoc.date)) {
          bestDoc = { id: doc.id, score: savedScore, date: savedDate };
        }
      });
      if (bestDoc) {
        if (record.score > bestDoc.score) {
          await firestoreDb.collection('rankings').doc(bestDoc.id).set(record);
        }
        return bestDoc.id;
      }
      const doc = await firestoreDb.collection('rankings').add(record);
      return doc.id;
    } catch(e) {
      console.warn('Online ranking save failed', e);
      return null;
    }
  }

  async function getOnlineRankings() {
    if (!firestoreDb) return null;
    try {
      const snap = await firestoreDb.collection('rankings')
        .get();
      return normalizeRankings(snap.docs.map(doc => ({ _id: doc.id, ...doc.data() })));
    } catch(e) {
      console.warn('Online ranking load failed', e);
      return null;
    }
  }

  player = { x: W/2, y: H - 80, stage: 0, wormCount: 0, flapPhase: 0 };
  obstacles = []; corns = []; foods = []; items = []; eggs = []; particles = []; shockwaves = []; clouds = [];
  for (let i = 0; i < 4; i++) {
    clouds.push({ x: Math.random() * W, y: 50 + Math.random() * (H - 200), w: 50 + Math.random() * 50, speed: 0.3 + Math.random() * 0.5 });
  }
  active = { shield: 0, magnet: 0, double: 0 };
  loadSprites(() => {
    ['egg', 'hatching', 'chick', 'chicken'].forEach(name => {
      const el = document.getElementById('preview-' + name);
      if (el) el.src = SPRITE_DATA[name];
    });
    hydrateLegendIcons();
    nicknameScreen.classList.remove('hidden');
    loop();
  });
})();
</script>
</body>
</html>
